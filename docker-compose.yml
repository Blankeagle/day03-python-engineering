services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile

    image: day03-agent:latest

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: "http://172.31.16.1:11434"
      REDIS_URL: "redis://redis:6379/0"
      LANGGRAPH_REDIS_URL: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5