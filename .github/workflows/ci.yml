name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "Day03 Agent CI"
      DEBUG: "false"
      OLLAMA_BASE_URL: "http://localhost:11434"
      MODEL_NAME: "qwen3:8b"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -m "not manual and not integration and not eval" -q

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/blankeagle/day03-agent:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/blankeagle/day03-agent:latest    
  
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'    
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
          set -e

          cd ~/day03-agent

          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d
          docker compose -f compose.prod.yml ps
          EOF


