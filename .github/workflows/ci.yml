name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "Day03 Agent CI"
      DEBUG: "false"
      OLLAMA_BASE_URL: "http://localhost:11434"
      MODEL_NAME: "qwen3:8b"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -m "not manual and not integration and not eval" -q


  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/blankeagle/day03-agent:${{ github.sha }} \
            -t ghcr.io/blankeagle/day03-agent:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/blankeagle/day03-agent:${{ github.sha }}
          docker push ghcr.io/blankeagle/day03-agent:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            compose.prod.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/day03-agent/compose.prod.yml"

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "IMAGE_TAG=${{ github.sha }} bash -s" << 'EOF'

          set -e

          cd ~/day03-agent

          echo "Deploying image: $IMAGE_TAG"

          # Read the previous successful image tag if it exists
          PREVIOUS_TAG=""
          if [ -f .last_good_image ]; then
            PREVIOUS_TAG=$(cat .last_good_image)
            echo "Previous successful image: $PREVIOUS_TAG"
          fi

          # Deploy the new image
          IMAGE_TAG=$IMAGE_TAG docker compose -f compose.prod.yml pull
          IMAGE_TAG=$IMAGE_TAG docker compose -f compose.prod.yml up -d

          echo "Waiting for application to become healthy..."

          HEALTHY=false

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health-test-fail > /dev/null; then
              HEALTHY=true
              echo "Application is healthy"
              break
            fi

            echo "Attempt $i failed, retrying in 3 seconds..."
            sleep 3
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "$IMAGE_TAG" > .last_good_image
            echo "Deployment successful: $IMAGE_TAG"
            exit 0
          fi

          echo "Deployment failed."

          # Show logs from the failed deployment
          IMAGE_TAG=$IMAGE_TAG docker compose -f compose.prod.yml logs --tail=100 agent

          # Roll back if a previous successful image exists
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Rolling back to: $PREVIOUS_TAG"

            IMAGE_TAG=$PREVIOUS_TAG docker compose -f compose.prod.yml up -d

            sleep 5

            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Rollback successful: $PREVIOUS_TAG"
            else
              echo "Rollback failed"
            fi
          else
            echo "No previous successful image available for rollback"
          fi

          exit 1
          EOF