services:
  agent:
    image: ghcr.io/blankeagle/day03-agent:v1

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_URL: "redis://redis:6379/0"
      LANGGRAPH_REDIS_URL: "redis://redis:6379/0"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:8

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data: